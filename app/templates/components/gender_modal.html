<!-- Gender Selection Modal Component -->
<div class="modal-backdrop" id="modal-gender-select">
  <div class="modal-card" style="max-width: 500px; text-align: center; padding: 28px 28px 32px; border-radius: 20px;">

    <!-- Image Preview Strip (hidden until file selected) -->
    <div id="gender-modal-preview-bar" style="display: none; align-items: center; gap: 14px; background: var(--bg-subtle); border: 1px solid var(--border-light); border-radius: 14px; padding: 10px 14px; margin-bottom: 20px; text-align: left;">
      <img id="gender-modal-thumb" src="" alt="Preview" style="width: 52px; height: 52px; object-fit: cover; border-radius: 10px; flex-shrink: 0; border: 2px solid var(--border-light);">
      <div style="flex: 1; min-width: 0;">
        <div id="gender-modal-filename" style="font-weight: 600; font-size: 0.85rem; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"></div>
        <div id="gender-modal-filesize" style="font-size: 0.75rem; color: var(--text-muted); margin-top: 2px;"></div>
      </div>
      <i class="fa-solid fa-circle-check" style="color: #22C55E; font-size: 1.2rem; flex-shrink: 0;"></i>
    </div>

    <!-- Face Scan Status (shown while /validate-face is running) -->
    <div id="face-scan-status" style="display: none; align-items: center; gap: 10px; background: var(--purple-light); border: 1px solid rgba(124,58,237,0.18); border-radius: 10px; padding: 9px 14px; margin-bottom: 14px; font-size: 0.82rem; font-weight: 600; color: var(--purple-primary);">
      <div style="width: 14px; height: 14px; border: 2px solid rgba(124,58,237,0.25); border-top-color: var(--purple-primary); border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0;"></div>
      <span>Checking for a face in your photo…</span>
    </div>

    <!-- Header Icon -->
    <div style="width: 60px; height: 60px; border-radius: 50%; background: var(--purple-light); color: var(--purple-primary); display: flex; align-items: center; justify-content: center; font-size: 1.7rem; margin: 0 auto 14px; box-shadow: var(--shadow-sm);">
      <i class="fa-solid fa-user-gear"></i>
    </div>

    <h3 id="gender-modal-title" style="font-size: 1.4rem; font-weight: 700; margin-bottom: 6px; color: var(--text-main);">Select Recommendation</h3>
    <p id="gender-modal-subtitle" style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 22px; line-height: 1.5;">
      Which recommendation would you like our AI to generate?
    </p>

    <!-- Face Validation Warning Banner (shown when no face detected) -->
    <div id="face-validation-warning" style="display: none; align-items: flex-start; gap: 10px; background: #FFF7ED; border: 1.5px solid #FB923C; border-radius: 12px; padding: 11px 14px; margin-bottom: 16px; text-align: left;">
      <i class="fa-solid fa-triangle-exclamation" style="color: #EA580C; font-size: 1rem; flex-shrink: 0; margin-top: 2px;"></i>
      <div>
        <div style="font-weight: 700; font-size: 0.83rem; color: #9A3412; margin-bottom: 2px;">No face detected</div>
        <div id="face-validation-msg" style="font-size: 0.78rem; color: #C2410C; line-height: 1.4;">Please upload a clear photo showing your face.</div>
      </div>
    </div>

    <div class="grid-12" style="gap: 14px;">
      <!-- Female Option Card -->
      <button class="col-6 col-sm-12 gender-modal-option" id="gender-opt-female" data-gender="female"
        style="background: var(--bg-subtle); border: 2px solid var(--border-light); border-radius: var(--radius-md); padding: 22px 16px; cursor: pointer; transition: var(--transition); display: flex; flex-direction: column; align-items: center; gap: 8px;">
        <div style="font-size: 2.2rem; line-height: 1;"><i class="fa-solid fa-venus" style="color: #EC4899;"></i></div>
        <div style="font-weight: 700; font-size: 1.05rem; color: var(--text-main);">Female Styles</div>
        <span style="font-size: 0.78rem; color: var(--text-muted);">Bobs, Lobs &amp; Soft Layers</span>
      </button>

      <!-- Male Option Card -->
      <button class="col-6 col-sm-12 gender-modal-option" id="gender-opt-male" data-gender="male"
        style="background: var(--bg-subtle); border: 2px solid var(--border-light); border-radius: var(--radius-md); padding: 22px 16px; cursor: pointer; transition: var(--transition); display: flex; flex-direction: column; align-items: center; gap: 8px;">
        <div style="font-size: 2.2rem; line-height: 1;"><i class="fa-solid fa-mars" style="color: #0284C7;"></i></div>
        <div style="font-weight: 700; font-size: 1.05rem; color: var(--text-main);">Male Styles</div>
        <span style="font-size: 0.78rem; color: var(--text-muted);">Crops, Fades &amp; Side Parts</span>
      </button>

      <!-- Color Analysis Option Card -->
      <button class="col-12 col-sm-12 gender-modal-option" id="opt-color-analysis" data-type="color"
        style="background: var(--bg-subtle); border: 2px solid var(--border-light); border-radius: var(--radius-md); padding: 16px; cursor: pointer; transition: var(--transition); display: flex; align-items: center; justify-content: center; gap: 12px;">
        <div style="font-size: 1.8rem; line-height: 1;"><i class="fa-solid fa-palette" style="color: #F43F5E;"></i></div>
        <div style="text-align: left;">
          <div style="font-weight: 700; font-size: 1.05rem; color: var(--text-main);">Color Analysis</div>
          <span style="font-size: 0.78rem; color: var(--text-muted);">Find the best colors for your skin tone</span>
        </div>
      </button>
    </div>

    <!-- Cancel Button -->
    <button id="gender-modal-cancel"
      style="
        margin-top: 20px;
        background: transparent;
        border: 1.5px solid var(--border-light);
        color: var(--text-muted);
        font-size: 0.83rem;
        font-weight: 600;
        font-family: var(--font-primary);
        cursor: pointer;
        padding: 9px 22px;
        border-radius: var(--radius-pill, 9999px);
        display: inline-flex;
        align-items: center;
        gap: 7px;
        letter-spacing: 0.01em;
        transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
      "
      onmouseover="this.style.borderColor='var(--purple-primary)';this.style.color='var(--purple-primary)';this.style.background='var(--purple-light)';this.style.transform='translateY(-2px)';this.style.boxShadow='0 6px 16px rgba(124,58,237,0.12)';"
      onmouseout="this.style.borderColor='var(--border-light)';this.style.color='var(--text-muted)';this.style.background='transparent';this.style.transform='none';this.style.boxShadow='none';"
      onmousedown="this.style.transform='scale(0.96)';"
      onmouseup="this.style.transform='translateY(-2px)';"
    >
      <i class="fa-solid fa-arrow-left" style="font-size: 0.75rem;"></i>
      Go Back
    </button>

    <!-- Loading Overlay (shown after gender chosen) -->
    <div id="gender-modal-loading" style="display: none; position: absolute; inset: 0; background: rgba(255,255,255,0.88); backdrop-filter: blur(6px); border-radius: 20px; flex-direction: column; align-items: center; justify-content: center; gap: 14px; z-index: 10;">
      <div style="width: 52px; height: 52px; border: 4px solid var(--purple-light); border-top-color: var(--purple-primary); border-radius: 50%; animation: spin 0.9s linear infinite;"></div>
      <div style="font-weight: 600; color: var(--purple-primary); font-size: 0.95rem;">Analyzing your photo…</div>
    </div>

  </div>
</div>
