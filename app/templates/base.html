<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}StyleMe - AI-Powered Beauty & Hairstyle Recommendation{% endblock %}</title>
  <meta name="description"
    content="Get personalized AI-powered hairstyle and color recommendations based on your unique face shape and skin tone features.">

  <!-- Font Awesome 6 Icon Package -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- HTML2Canvas for PNG Image Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <!-- Application CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

  <!-- Navigation Header Include -->
  {% include 'components/navbar.html' %}

  <main>
    {% block content %}
    {% endblock %}
  </main>

  <!-- Footer Include -->
  {% include 'components/footer.html' %}

  <!-- Global Modals -->
  {% include 'components/gender_modal.html' %}
  {% include 'components/barber_card_modal.html' %}

  <!-- Application Scripts -->
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  <script src="{{ url_for('static', filename='js/gender_upload.js') }}"></script>
  <script src="{{ url_for('static', filename='js/barber_card.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>

</html>
