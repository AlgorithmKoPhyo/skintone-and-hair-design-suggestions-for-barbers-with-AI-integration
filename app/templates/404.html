<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found - Shape and Shade</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden; /* Prevent scrolling */
      height: 100vh;
      width: 100vw;
      background: var(--bg-light, #fbfbfe);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Plus Jakarta Sans', sans-serif;
      position: relative;
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-15px); }
      100% { transform: translateY(0px); }
    }
    .floating-icon {
      animation: float 3s ease-in-out infinite;
      font-size: 5.5rem;
      color: #ec4899;
      margin-bottom: 1.5rem;
    }
    .error-gradient-text {
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 6rem;
      font-weight: 800;
      margin: 0 0 0.5rem 0;
    }
    .error-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
      transition: transform 0.3s ease;
      padding: 4rem 3rem;
      border-radius: 30px;
      text-align: center;
      max-width: 650px;
      width: 90%;
      position: relative;
      z-index: 10;
    }
    .error-card:hover {
      transform: translateY(-5px);
    }
    .bg-blob-1 {
      position: absolute; top: 10%; left: 10%; width: 300px; height: 300px; background: rgba(236, 72, 153, 0.1); border-radius: 50%; filter: blur(60px); z-index: 0;
    }
    .bg-blob-2 {
      position: absolute; bottom: 10%; right: 10%; width: 250px; height: 250px; background: rgba(139, 92, 246, 0.1); border-radius: 50%; filter: blur(50px); z-index: 0;
    }
  </style>
</head>
<body>
  <!-- Decorative background elements -->
  <div class="bg-blob-1"></div>
  <div class="bg-blob-2"></div>

  <div class="error-card">
    <div class="floating-icon">
      <i class="fa-solid fa-ghost"></i>
    </div>
    <h1 class="error-gradient-text">404</h1>
    <h2 style="font-size: 1.8rem; font-weight: 700; color: #2D3748; margin-bottom: 1rem;">Looks like you're lost in style!</h2>
    <p style="font-size: 1.1rem; line-height: 1.6; color: #64748b; margin-bottom: 2.5rem;">
      The page you are looking for has vanished into thin air. Let's get you back on track to finding your perfect look.
    </p>
    <a href="/" class="btn-primary-pink" style="display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 14px 36px; border-radius: 50px; text-decoration: none; font-weight: 600; font-size: 1.05rem; box-shadow: 0 8px 20px rgba(236, 72, 153, 0.25); transition: all 0.3s ease;">
      <i class="fa-solid fa-house"></i> Back to Homepage
    </a>
  </div>
</body>
</html>
